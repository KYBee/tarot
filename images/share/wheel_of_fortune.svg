<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="당신의 타로 카드는 운명의 수레바퀴">
  <defs>
    <linearGradient id="bg-wheel_of_fortune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12081f" />
      <stop offset="52%" stop-color="#2b1244" />
      <stop offset="100%" stop-color="#090511" />
    </linearGradient>
    <linearGradient id="gold-wheel_of_fortune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d46a" />
      <stop offset="100%" stop-color="#c8972c" />
    </linearGradient>
    <filter id="glow-wheel_of_fortune" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-wheel_of_fortune)" />
  <circle cx="930" cy="120" r="190" fill="rgba(116,78,164,0.24)" />
  <circle cx="240" cy="88" r="120" fill="rgba(244,212,106,0.08)" filter="url(#glow-wheel_of_fortune)" />
  <circle cx="1044" cy="488" r="154" fill="rgba(244,212,106,0.06)" />

  <rect x="74" y="58" width="1052" height="514" rx="34" fill="rgba(15,10,27,0.56)" stroke="rgba(244,212,106,0.18)" />
  <text x="120" y="132" font-family="'Outfit', sans-serif" font-size="34" fill="#f4d46a">너의 타로는?</text>
  <text x="120" y="176" font-family="'Noto Sans KR', sans-serif" font-size="28" fill="#f8f4ff">당신의 타로 카드는 운명의 수레바퀴</text>

  <g transform="translate(120, 220)">
    <rect x="0" y="0" width="290" height="352" rx="28" fill="rgba(25,16,42,0.92)" stroke="url(#gold-wheel_of_fortune)" stroke-width="2" />
    <rect x="20" y="20" width="250" height="312" rx="22" fill="rgba(248,244,255,0.04)" stroke="rgba(244,212,106,0.22)" />
    <text x="145" y="78" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="24" fill="#f4d46a">TAROT PROFILE</text>
    <text x="145" y="182" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="52" font-weight="700" fill="#f8f4ff">운명의 수레바퀴</text>
    <line x1="72" y1="214" x2="218" y2="214" stroke="rgba(244,212,106,0.36)" />
    <text x="145" y="268" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="22" fill="#d8d0e5">지금의 나를 읽는 카드</text>
  </g>

  
        <g transform="translate(110, 508)">
          <rect x="0" y="0" width="138" height="42" rx="21" fill="rgba(248,244,255,0.08)" stroke="rgba(244,212,106,0.32)" />
          <text x="69" y="27" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="20" fill="#f8f4ff">전환</text>
        </g>
      
        <g transform="translate(280, 508)">
          <rect x="0" y="0" width="138" height="42" rx="21" fill="rgba(248,244,255,0.08)" stroke="rgba(244,212,106,0.32)" />
          <text x="69" y="27" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="20" fill="#f8f4ff">흐름</text>
        </g>
      
        <g transform="translate(450, 508)">
          <rect x="0" y="0" width="138" height="42" rx="21" fill="rgba(248,244,255,0.08)" stroke="rgba(244,212,106,0.32)" />
          <text x="69" y="27" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="20" fill="#f8f4ff">타이밍</text>
        </g>
      
  <text x="120" y="626" font-family="'Noto Sans KR', sans-serif" font-size="24" fill="#d8d0e5">변화의 흐름을 타고 전환점으로 나아가는 카드입니다.</text><text x="120" y="660" font-family="'Noto Sans KR', sans-serif" font-size="24" fill="#d8d0e5">자세한 해석을 눌러 확인해보세요.</text>

  <g transform="translate(802, 532)">
    <rect x="0" y="0" width="244" height="54" rx="27" fill="url(#gold-wheel_of_fortune)" />
    <text x="122" y="35" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="24" font-weight="700" fill="#1a0f2e">결과 보기</text>
  </g>
</svg>
